# ~/.config/yazi/yazi.toml
[manager]
linemode = "size_and_mtime"

show_hidden = true
show_symlink = true

# https://yazi-rs.github.io/docs/configuration/yazi#opener
[opener]
edit = [
	{ run = 'nvim "$@"', block = true, for = "unix" },
	{ run = "nvim %*",   block = true, for = "windows" },
]
play = [
	{ run = 'vlc "$@"', orphan = true, for = "unix" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]
pdf = [
	{ run = 'zathura "$@"', desc = "Open PDF with Zathura" },
]
xreader = [
	{ run = 'xreader "$@"', desc = "Open PDF with xreader" },
]
python_exec = [
    { run = 'kitty -- bash -c "python3 \"$@\"; exec bash"', desc = "Run Python script in terminal" }
]
open_with_vlc = [
    { run = 'vlc "$1"', desc = "Open with VLC Media Player" }
]
convert_video = [
    { run = 'ffmpeg -i "$1" "${1%.*}.mp4"', desc = "Convert video to mp4" }
]
video_compress = [
    { run = 'python3 ~/.config/yazi/scripts/ffmpeg/video_compressor.py "$1"', desc = "Compress video(s)" }
]
image_compress = [
    { run = 'python3 ~/.config/yazi/scripts/ffmpeg/image_compressor.py "$1"', block = true, desc = "Compress image(s)" }
]
image_convert = [
    { run = 'kitty -- bash -c "python3 ~/.config/yazi/scripts/ffmpeg/image_converter.py \"$1\"; exec bash"', block = true, desc = "Convert image format" }
]

# https://yazi-rs.github.io/docs/configuration/yazi#open
[open]
prepend_rules = [
	{ url = "*.json", use = "edit" },

	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },

	# Set zathura as the default opener for PDF files, with xreader as alternative
	{ url = "*.pdf", use = [ "pdf", "xreader", "open" ] },

	{ url = "*.py", use = [ "edit", "python_exec" ] },

  # Videos
  { url = "*.mp4", use = [ "open", "open_with_vlc", "video_compress" ] },
  { url = "*.mkv", use = [ "open", "open_with_vlc", "convert_video", "video_compress" ] },
  { url = "*.webm", use = [ "open", "open_with_vlc", "convert_video", "video_compress" ] },
  { url = "*.avi", use = [ "open", "open_with_vlc", "convert_video", "video_compress" ] },
  { url = "*.mov", use = [ "open", "open_with_vlc", "convert_video", "video_compress" ] },
  { url = "*.flv", use = [ "open", "open_with_vlc", "convert_video", "video_compress" ] },


  # Images
  { url = "*.jpg", use = ["open", "image_convert", "image_compress"] },
  { url = "*.jpeg", use = ["open", "image_convert", "image_compress"] },
  { url = "*.png", use = ["open", "image_convert", "image_compress"] },
  { url = "*.bmp", use = ["open", "image_convert", "image_compress"] },
  { url = "*.gif", use = ["open", "image_convert", "image_compress"] },
  { url = "*.tiff", use = ["open", "image_convert", "image_compress"] },
  { url = "*.webp", use = ["open", "image_convert", "image_compress"] },
  { url = "*.svg", use = ["open", "image_convert"] },
  { url = "*.ico", use = ["open", "image_convert"] },
]

# https://github.com/Sonico98/exifaudio.yazi
[plugin]
prepend_previewers = [
    { mime = "audio/*",   run = "exifaudio"}
]
